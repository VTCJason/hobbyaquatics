<body>
  <div class="stage"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7200 4500" width="7200" height="4500" preserveAspectRatio="xMidYMid meet" style="display:block;background:#ffffff;font-family:'Segoe UI',Calibri,Arial,sans-serif;"><rect x="0" y="0" width="7200" height="4500" fill="#ffffff" /><text x="3600.0" y="210" font-size="100" font-weight="800" fill="#1e3a5f" text-anchor="middle" letter-spacing="2">SWOT 4&#215;4: AI&#39;s Impact by Professional Role (2026&#8211;2030)</text><text x="3600.0" y="265" font-size="36" font-style="italic" fill="#4b5563" text-anchor="middle">A role-segmented view of Strengths, Weaknesses, Opportunities, and Threats across four work archetypes</text><text x="3600.0" y="315" font-size="28" fill="#374151" text-anchor="middle"><tspan font-weight="700">Roles compared:</tspan>  Professional  &#183;  Executive  &#183;  Service  &#183;  Professional Sales</text><line x1="180" y1="350" x2="7020" y2="350" stroke="#1e3a5f" stroke-width="5" /><text x="1835.0" y="398" font-size="28" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="4">HELPFUL &#8212; WHERE AI LIFTS THE ROLE</text><text x="5365.0" y="398" font-size="28" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="4">HARMFUL &#8212; WHERE AI PRESSURES THE ROLE</text><rect x="100" y="410" width="3470.0" height="1360.0" rx="20" ry="20" fill="#f0fdf4" stroke="#166534" stroke-width="6" /><rect x="130" y="438" width="200" height="48" rx="24" ry="24" fill="#166534" /><text x="230.0" y="472.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">INTERNAL</text><text x="1835.0" y="485" font-size="76" font-weight="800" fill="#166534" text-anchor="middle" letter-spacing="3">STRENGTHS</text><text x="1835.0" y="530" font-size="26" font-style="italic" fill="#374151" text-anchor="middle">What each role already brings that AI cannot yet replicate</text><line x1="140" y1="565" x2="3530.0" y2="565" stroke="#166534" stroke-width="2" stroke-opacity="0.4" /><rect x="130" y="610" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(152,632) scale(4.014500000000001)" fill="#166534"><path d="M12 2a1.2 1.2 0 0 0-1.2 1.2v.6L4.6 5.2a1 1 0 0 0 .4 1.96l5.8-1.16v13H6v2h12v-2h-4.8V6l5.8 1.16A1 1 0 0 0 19.4 5.2L13.2 3.8v-.6A1.2 1.2 0 0 0 12 2zM4 8l-3 7c0 1.66 1.34 3 3 3s3-1.34 3-3L4 8zm16 0l-3 7c0 1.66 1.34 3 3 3s3-1.34 3-3l-3-7z"/></g><text x="270.348" y="686.684" font-size="52.080000000000005" font-weight="800" fill="#166534" letter-spacing="1.5">PROFESSIONAL</text><text x="270.348" y="723.3752" font-size="26.208000000000002" font-style="italic" fill="#6b7280">Lawyer  &middot;  Doctor  &middot;  Engineer</text><line x1="152" y1="736.348" x2="1798.0" y2="736.348" stroke="#166534" stroke-width="2.5" /><circle cx="172" cy="780.6999999999999" r="6.048" fill="#111827" /><text x="198" y="803.548" font-size="33.6" font-weight="700" fill="#111827">Licensed authority.<tspan font-weight="400" fill="#1f2937"> Practice rights are regulated and cannot be delegated to a model.</tspan></text><circle cx="172" cy="842.8599999999999" r="6.048" fill="#111827" /><text x="198" y="865.708" font-size="33.6" font-weight="700" fill="#111827">Liability anchor.<tspan font-weight="400" fill="#1f2937"> Clients still need a person to sign and stand behind the work.</tspan></text><circle cx="172" cy="905.0199999999999" r="6.048" fill="#111827" /><text x="198" y="927.8679999999999" font-size="33.6" font-weight="700" fill="#111827">Edge-case judgment.<tspan font-weight="400" fill="#1f2937"> The non-routine matter is where humans still clearly win.</tspan></text><circle cx="172" cy="967.1799999999998" r="6.048" fill="#111827" /><text x="198" y="990.0279999999999" font-size="33.6" font-weight="700" fill="#111827">Specialty depth.<tspan font-weight="400" fill="#1f2937"> Years of charts, briefs, or specs sharpen prompts and catch AI errors</tspan></text><text x="198" y="1035.052" font-size="33.6" fill="#1f2937">others miss.</text><rect x="1850.0" y="610" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(1872.0,632) scale(4.014500000000001)" fill="#166534"><path d="M11 2v2h-2v2h2v2h-1.5l-3 11h11l-3-11H13v-2h2v-2h-2V2h-2zm-3.5 17h9l.5 3h-10l.5-3z"/></g><text x="1990.348" y="686.684" font-size="52.080000000000005" font-weight="800" fill="#166534" letter-spacing="1.5">EXECUTIVE</text><text x="1990.348" y="723.3752" font-size="26.208000000000002" font-style="italic" fill="#6b7280">CEO  &middot;  CFO  &middot;  CTO  &middot;  CHRO</text><line x1="1872.0" y1="736.348" x2="3518.0" y2="736.348" stroke="#166534" stroke-width="2.5" /><circle cx="1892.0" cy="780.6999999999999" r="6.048" fill="#111827" /><text x="1918.0" y="803.548" font-size="33.6" font-weight="700" fill="#111827">Capital allocation.<tspan font-weight="400" fill="#1f2937"> The build-vs-buy and AI-strategy calls sit in your seat.</tspan></text><circle cx="1892.0" cy="842.8599999999999" r="6.048" fill="#111827" /><text x="1918.0" y="865.708" font-size="33.6" font-weight="700" fill="#111827">Whole-board context.<tspan font-weight="400" fill="#1f2937"> You see how finance, ops, legal, and culture interact.</tspan></text><circle cx="1892.0" cy="905.0199999999999" r="6.048" fill="#111827" /><text x="1918.0" y="927.8679999999999" font-size="33.6" font-weight="700" fill="#111827">Stakeholder trust.<tspan font-weight="400" fill="#1f2937"> Boards and investors buy the leader as much as the strategy.</tspan></text><circle cx="1892.0" cy="967.1799999999998" r="6.048" fill="#111827" /><text x="1918.0" y="990.0279999999999" font-size="33.6" font-weight="700" fill="#111827">Convening authority.<tspan font-weight="400" fill="#1f2937"> You can mandate the pilot, redirect budget, and clear the political</tspan></text><text x="1918.0" y="1035.052" font-size="33.6" fill="#1f2937">blockers ICs cannot.</text><rect x="130" y="1125.0" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(152,1147.0) scale(4.014500000000001)" fill="#166534"><path d="M9 3a1 1 0 0 0-1 1v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4V4a1 1 0 0 0-1-1H9zm1 2h4v1h-4V5zM4 11h4v2H4v-2zm12 0h4v2h-4v-2zm-6 0h4v4h-4v-4z"/></g><text x="270.348" y="1201.684" font-size="52.080000000000005" font-weight="800" fill="#166534" letter-spacing="1.5">SERVICE</text><text x="270.348" y="1238.3752" font-size="26.208000000000002" font-style="italic" fill="#6b7280">Educator  &middot;  Programmer  &middot;  Consultant</text><line x1="152" y1="1251.348" x2="1798.0" y2="1251.348" stroke="#166534" stroke-width="2.5" /><circle cx="172" cy="1295.6999999999998" r="6.048" fill="#111827" /><text x="198" y="1318.5479999999998" font-size="33.6" font-weight="700" fill="#111827">Force multiplier.<tspan font-weight="400" fill="#1f2937"> Service work is digital &mdash; AI tooling plugs in directly.</tspan></text><circle cx="172" cy="1357.8599999999997" r="6.048" fill="#111827" /><text x="198" y="1380.7079999999996" font-size="33.6" font-weight="700" fill="#111827">Taste &amp; curation.<tspan font-weight="400" fill="#1f2937"> Distinguishing good from generic is the new scarce skill.</tspan></text><circle cx="172" cy="1420.0199999999995" r="6.048" fill="#111827" /><text x="198" y="1442.8679999999995" font-size="33.6" font-weight="700" fill="#111827">Productizable expertise.<tspan font-weight="400" fill="#1f2937"> Frameworks can be packaged into recurring AI offerings.</tspan></text><circle cx="172" cy="1482.1799999999994" r="6.048" fill="#111827" /><text x="198" y="1505.0279999999993" font-size="33.6" font-weight="700" fill="#111827">Tight feedback loops.<tspan font-weight="400" fill="#1f2937"> Service work is iterative &mdash; exactly the rhythm AI rewards.</tspan></text><rect x="1850.0" y="1125.0" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(1872.0,1147.0) scale(4.014500000000001)" fill="#166534"><path d="M2 9l4-4 3 3-4 4-3-3zm20 0l-4-4-3 3 4 4 3-3zm-9-2L9.5 10.5a1.5 1.5 0 1 0 2.12 2.12l1-1 4 4a1.5 1.5 0 1 0 2.12-2.12l-1-1 1-1a1.5 1.5 0 0 0 0-2.12L13.5 5.5 13 7zM4 15l4 4h2l-3-3-3-1zm16 0l-4 4h-2l3-3 3-1z"/></g><text x="1990.348" y="1201.684" font-size="52.080000000000005" font-weight="800" fill="#166534" letter-spacing="1.5">PRO SALES</text><text x="1990.348" y="1238.3752" font-size="26.208000000000002" font-style="italic" fill="#6b7280">SaaS  &middot;  Industrial  &middot;  MedTech</text><line x1="1872.0" y1="1251.348" x2="3518.0" y2="1251.348" stroke="#166534" stroke-width="2.5" /><circle cx="1892.0" cy="1295.6999999999998" r="6.048" fill="#111827" /><text x="1918.0" y="1318.5479999999998" font-size="33.6" font-weight="700" fill="#111827">Trust networks.<tspan font-weight="400" fill="#1f2937"> Six- and seven-figure B2B deals close on relationships, not chatbots.</tspan></text><circle cx="1892.0" cy="1357.8599999999997" r="6.048" fill="#111827" /><text x="1918.0" y="1380.7079999999996" font-size="33.6" font-weight="700" fill="#111827">Field intelligence.<tspan font-weight="400" fill="#1f2937"> Lived knowledge of the customer beats any scraped data.</tspan></text><circle cx="1892.0" cy="1420.0199999999995" r="6.048" fill="#111827" /><text x="1918.0" y="1442.8679999999995" font-size="33.6" font-weight="700" fill="#111827">Negotiation under pressure.<tspan font-weight="400" fill="#1f2937"> Reading the room stays a human-only skill.</tspan></text><circle cx="1892.0" cy="1482.1799999999994" r="6.048" fill="#111827" /><text x="1918.0" y="1505.0279999999993" font-size="33.6" font-weight="700" fill="#111827">AI-augmented prep.<tspan font-weight="400" fill="#1f2937"> Account research, call summaries, and proposal drafts collapse from days</tspan></text><text x="1918.0" y="1550.0519999999995" font-size="33.6" fill="#1f2937">to hours.</text><rect x="130" y="1630.0" width="3410.0" height="110" rx="10" ry="10" fill="#ffffff" stroke="#166534" stroke-width="2" stroke-opacity="0.6" /><rect x="130" y="1630.0" width="10" height="110" fill="#166534" /><text x="160" y="1668.0" font-size="22" font-weight="800" fill="#166534" letter-spacing="3">DATA POINT</text><text x="160" y="1700.0" font-size="28" fill="#1f2937">Models are "staggeringly good at verifiable tasks" but weaker on ambiguous ones &mdash; "only the senior survive" in AI-augmented workflows.</text><text x="3516.0" y="1718.0" font-size="22" font-style="italic" fill="#6b7280" text-anchor="end">&mdash; METR, Mar 2026</text><rect x="3630.0" y="410" width="3470.0" height="1360.0" rx="20" ry="20" fill="#fffbeb" stroke="#b45309" stroke-width="6" /><rect x="3660.0" y="438" width="200" height="48" rx="24" ry="24" fill="#b45309" /><text x="3760.0" y="472.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">INTERNAL</text><text x="5365.0" y="485" font-size="76" font-weight="800" fill="#b45309" text-anchor="middle" letter-spacing="3">WEAKNESSES</text><text x="5365.0" y="530" font-size="26" font-style="italic" fill="#374151" text-anchor="middle">Where each role is most exposed from within</text><line x1="3670.0" y1="565" x2="7060.0" y2="565" stroke="#b45309" stroke-width="2" stroke-opacity="0.4" /><rect x="3660.0" y="610" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(3682.0,632) scale(4.014500000000001)" fill="#b45309"><path d="M12 2a1.2 1.2 0 0 0-1.2 1.2v.6L4.6 5.2a1 1 0 0 0 .4 1.96l5.8-1.16v13H6v2h12v-2h-4.8V6l5.8 1.16A1 1 0 0 0 19.4 5.2L13.2 3.8v-.6A1.2 1.2 0 0 0 12 2zM4 8l-3 7c0 1.66 1.34 3 3 3s3-1.34 3-3L4 8zm16 0l-3 7c0 1.66 1.34 3 3 3s3-1.34 3-3l-3-7z"/></g><text x="3800.348" y="686.684" font-size="52.080000000000005" font-weight="800" fill="#b45309" letter-spacing="1.5">PROFESSIONAL</text><text x="3800.348" y="723.3752" font-size="26.208000000000002" font-style="italic" fill="#6b7280">Lawyer  &middot;  Doctor  &middot;  Engineer</text><line x1="3682.0" y1="736.348" x2="5328.0" y2="736.348" stroke="#b45309" stroke-width="2.5" /><circle cx="3702.0" cy="780.6999999999999" r="6.048" fill="#111827" /><text x="3728.0" y="803.548" font-size="33.6" font-weight="700" fill="#111827">High billable-hour exposure.<tspan font-weight="400" fill="#1f2937"> Research, drafting, and review sit in AI&rsquo;s sweet spot.</tspan></text><circle cx="3702.0" cy="842.8599999999999" r="6.048" fill="#111827" /><text x="3728.0" y="865.708" font-size="33.6" font-weight="700" fill="#111827">Hallucination risk.<tspan font-weight="400" fill="#1f2937"> One bad citation or readout can end a career built over decades.</tspan></text><circle cx="3702.0" cy="905.0199999999999" r="6.048" fill="#111827" /><text x="3728.0" y="927.8679999999999" font-size="33.6" font-weight="700" fill="#111827">Slow institutional adoption.<tspan font-weight="400" fill="#1f2937"> Risk-averse firms and carriers lag the tooling.</tspan></text><circle cx="3702.0" cy="967.1799999999998" r="6.048" fill="#111827" /><text x="3728.0" y="990.0279999999999" font-size="33.6" font-weight="700" fill="#111827">Mid-career salary premium.<tspan font-weight="400" fill="#1f2937"> AI compresses the junior-senior gap; seniority pay bands come</tspan></text><text x="3728.0" y="1035.052" font-size="33.6" fill="#1f2937">under pressure.</text><rect x="5380.0" y="610" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(5402.0,632) scale(4.014500000000001)" fill="#b45309"><path d="M11 2v2h-2v2h2v2h-1.5l-3 11h11l-3-11H13v-2h2v-2h-2V2h-2zm-3.5 17h9l.5 3h-10l.5-3z"/></g><text x="5520.348" y="686.684" font-size="52.080000000000005" font-weight="800" fill="#b45309" letter-spacing="1.5">EXECUTIVE</text><text x="5520.348" y="723.3752" font-size="26.208000000000002" font-style="italic" fill="#6b7280">CEO  &middot;  CFO  &middot;  CTO  &middot;  CHRO</text><line x1="5402.0" y1="736.348" x2="7048.0" y2="736.348" stroke="#b45309" stroke-width="2.5" /><circle cx="5422.0" cy="780.6999999999999" r="6.048" fill="#111827" /><text x="5448.0" y="803.548" font-size="33.6" font-weight="700" fill="#111827">Distance from the work.<tspan font-weight="400" fill="#1f2937"> Harder to evaluate AI output you don&rsquo;t produce yourself.</tspan></text><circle cx="5422.0" cy="842.8599999999999" r="6.048" fill="#111827" /><text x="5448.0" y="865.708" font-size="33.6" font-weight="700" fill="#111827">Strategy debt.<tspan font-weight="400" fill="#1f2937"> Five-year plans assume pre-AI cost curves and headcount.</tspan></text><circle cx="5422.0" cy="905.0199999999999" r="6.048" fill="#111827" /><text x="5448.0" y="927.8679999999999" font-size="33.6" font-weight="700" fill="#111827">Talent ladder gaps.<tspan font-weight="400" fill="#1f2937"> If junior roles automate, who do you promote in five years?</tspan></text><circle cx="5422.0" cy="967.1799999999998" r="6.048" fill="#111827" /><text x="5448.0" y="990.0279999999999" font-size="33.6" font-weight="700" fill="#111827">Vendor lock-in risk.<tspan font-weight="400" fill="#1f2937"> Bets on specific models or providers may age fast as the frontier</tspan></text><text x="5448.0" y="1035.052" font-size="33.6" fill="#1f2937">moves.</text><rect x="3660.0" y="1125.0" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(3682.0,1147.0) scale(4.014500000000001)" fill="#b45309"><path d="M9 3a1 1 0 0 0-1 1v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4V4a1 1 0 0 0-1-1H9zm1 2h4v1h-4V5zM4 11h4v2H4v-2zm12 0h4v2h-4v-2zm-6 0h4v4h-4v-4z"/></g><text x="3800.348" y="1201.684" font-size="52.080000000000005" font-weight="800" fill="#b45309" letter-spacing="1.5">SERVICE</text><text x="3800.348" y="1238.3752" font-size="26.208000000000002" font-style="italic" fill="#6b7280">Educator  &middot;  Programmer  &middot;  Consultant</text><line x1="3682.0" y1="1251.348" x2="5328.0" y2="1251.348" stroke="#b45309" stroke-width="2.5" /><circle cx="3702.0" cy="1295.6999999999998" r="6.048" fill="#111827" /><text x="3728.0" y="1318.5479999999998" font-size="33.6" font-weight="700" fill="#111827">Most-automatable tasks.<tspan font-weight="400" fill="#1f2937"> Tutoring, boilerplate code, slide decks commoditize first.</tspan></text><circle cx="3702.0" cy="1357.8599999999997" r="6.048" fill="#111827" /><text x="3728.0" y="1380.7079999999996" font-size="33.6" font-weight="700" fill="#111827">Hourly-rate squeeze.<tspan font-weight="400" fill="#1f2937"> Clients see AI prices and arrive expecting discounts.</tspan></text><circle cx="3702.0" cy="1420.0199999999995" r="6.048" fill="#111827" /><text x="3728.0" y="1442.8679999999995" font-size="33.6" font-weight="700" fill="#111827">Skill decay.<tspan font-weight="400" fill="#1f2937"> Heavy AI reliance erodes the underlying craft over time.</tspan></text><circle cx="3702.0" cy="1482.1799999999994" r="6.048" fill="#111827" /><text x="3728.0" y="1505.0279999999993" font-size="33.6" font-weight="700" fill="#111827">Portfolio dilution.<tspan font-weight="400" fill="#1f2937"> When everyone produces more, attention fragments and getting noticed</tspan></text><text x="3728.0" y="1550.0519999999995" font-size="33.6" fill="#1f2937">gets harder.</text><rect x="5380.0" y="1125.0" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(5402.0,1147.0) scale(4.014500000000001)" fill="#b45309"><path d="M2 9l4-4 3 3-4 4-3-3zm20 0l-4-4-3 3 4 4 3-3zm-9-2L9.5 10.5a1.5 1.5 0 1 0 2.12 2.12l1-1 4 4a1.5 1.5 0 1 0 2.12-2.12l-1-1 1-1a1.5 1.5 0 0 0 0-2.12L13.5 5.5 13 7zM4 15l4 4h2l-3-3-3-1zm16 0l-4 4h-2l3-3 3-1z"/></g><text x="5520.348" y="1201.684" font-size="52.080000000000005" font-weight="800" fill="#b45309" letter-spacing="1.5">PRO SALES</text><text x="5520.348" y="1238.3752" font-size="26.208000000000002" fon text-anchor="middle" letter-spacing="3">THREATS</text><text x="5365.0" y="1950.0" font-size="26" font-style="italic" fill="#374151" text-anchor="middle">Headwinds outside the role's control that could reshape the field</text><line x1="3670.0" y1="1985.0" x2="7060.0" y2="1985.0" stroke="#b91c1c" stroke-width="2" stroke-opacity="0.4" /><rect x="3660.0" y="2030.0" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(3682.0,2052.0) scale(4.014500000000001)" fill="#b91c1c"><path d="M12 2a1.2 1.2 0 0 0-1.2 1.2v.6L4.6 5.2a1 1 0 0 0 .4 1.96l5.8-1.16v13H6v2h12v-2h-4.8V6l5.8 1.16A1 1 0 0 0 19.4 5.2L13.2 3.8v-.6A1.2 1.2 0 0 0 12 2zM4 8l-3 7c0 1.66 1.34 3 3 3s3-1.34 3-3L4 8zm16 0l-3 7c0 1.66 1.34 3 3 3s3-1.34 3-3l-3-7z"/></g><text x="3800.348" y="2106.684" font-size="52.080000000000005" font-weight="800" fill="#b91c1c" letter-spacing="1.5">PROFESSIONAL</text><text x="3800.348" y="2143.3752000000004" font-size="26.208000000000002" font-style="italic" fill="#6b7280">Lawyer  &middot;  Doctor  &middot;  Engineer</text><line x1="3682.0" y1="2156.348" x2="5328.0" y2="2156.348" stroke="#b91c1c" stroke-width="2.5" /><circle cx="3702.0" cy="2200.7" r="6.048" fill="#111827" /><text x="3728.0" y="2223.548" font-size="33.6" font-weight="700" fill="#111827">Unbundling of services.<tspan font-weight="400" fill="#1f2937"> Clients buy contracts, scans, or designs &agrave; la carte from AI.</tspan></text><circle cx="3702.0" cy="2262.8599999999997" r="6.048" fill="#111827" /><text x="3728.0" y="2285.7079999999996" font-size="33.6" font-weight="700" fill="#111827">Regulatory lag.<tspan font-weight="400" fill="#1f2937"> Rules evolve slower than tools; ethics gray zones widen.</tspan></text><circle cx="3702.0" cy="2325.0199999999995" r="6.048" fill="#111827" /><text x="3728.0" y="2347.8679999999995" font-size="33.6" font-weight="700" fill="#111827">Fee compression.<tspan font-weight="400" fill="#1f2937"> Commoditized work drags rates downward.</tspan></text><circle cx="3702.0" cy="2387.1799999999994" r="6.048" fill="#111827" /><text x="3728.0" y="2410.0279999999993" font-size="33.6" font-weight="700" fill="#111827">Insurance and audit pressure.<tspan font-weight="400" fill="#1f2937"> Carriers scrutinize AI use; non-compliant workflows raise</tspan></text><text x="3728.0" y="2455.051999999999" font-size="33.6" fill="#1f2937">premiums or kill coverage.</text><rect x="5380.0" y="2030.0" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(5402.0,2052.0) scale(4.014500000000001)" fill="#b91c1c"><path d="M11 2v2h-2v2h2v2h-1.5l-3 11h11l-3-11H13v-2h2v-2h-2V2h-2zm-3.5 17h9l.5 3h-10l.5-3z"/></g><text x="5520.348" y="2106.684" font-size="52.080000000000005" font-weight="800" fill="#b91c1c" letter-spacing="1.5">EXECUTIVE</text><text x="5520.348" y="2143.3752000000004" font-size="26.208000000000002" font-style="italic" fill="#6b7280">CEO  &middot;  CFO  &middot;  CTO  &middot;  CHRO</text><line x1="5402.0" y1="2156.348" x2="7048.0" y2="2156.348" stroke="#b91c1c" stroke-width="2.5" /><circle cx="5422.0" cy="2200.7" r="6.048" fill="#111827" /><text x="5448.0" y="2223.548" font-size="33.6" font-weight="700" fill="#111827">Disruption from below.<tspan font-weight="400" fill="#1f2937"> AI-native upstarts attack on cost, speed, and CX.</tspan></text><circle cx="5422.0" cy="2262.8599999999997" r="6.048" fill="#111827" /><text x="5448.0" y="2285.7079999999996" font-size="33.6" font-weight="700" fill="#111827">Activist scrutiny.<tspan font-weight="400" fill="#1f2937"> Investors demand crisp AI strategy and headcount answers.</tspan></text><circle cx="5422.0" cy="2325.0199999999995" r="6.048" fill="#111827" /><text x="5448.0" y="2347.8679999999995" font-size="33.6" font-weight="700" fill="#111827">Governance &amp; liability.<tspan font-weight="400" fill="#1f2937"> Data, privacy, IP, and bias exposure all multiply.</tspan></text><circle cx="5422.0" cy="2387.1799999999994" r="6.048" fill="#111827" /><text x="5448.0" y="2410.0279999999993" font-size="33.6" font-weight="700" fill="#111827">Talent flight.<tspan font-weight="400" fill="#1f2937"> Top performers leave firms that move slowly on AI &mdash; resumes age, the</tspan></text><text x="5448.0" y="2455.051999999999" font-size="33.6" fill="#1f2937">work goes dull.</text><rect x="3660.0" y="2545.0" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(3682.0,2567.0) scale(4.014500000000001)" fill="#b91c1c"><path d="M9 3a1 1 0 0 0-1 1v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4V4a1 1 0 0 0-1-1H9zm1 2h4v1h-4V5zM4 11h4v2H4v-2zm12 0h4v2h-4v-2zm-6 0h4v4h-4v-4z"/></g><text x="3800.348" y="2621.684" font-size="52.080000000000005" font-weight="800" fill="#b91c1c" letter-spacing="1.5">SERVICE</text><text x="3800.348" y="2658.3752000000004" font-size="26.208000000000002" font-style="italic" fill="#6b7280">Educator  &middot;  Programmer  &middot;  Consultant</text><line x1="3682.0" y1="2671.348" x2="5328.0" y2="2671.348" stroke="#b91c1c" stroke-width="2.5" /><circle cx="3702.0" cy="2715.7" r="6.048" fill="#111827" /><text x="3728.0" y="2738.548" font-size="33.6" font-weight="700" fill="#111827">Race to the bottom.<tspan font-weight="400" fill="#1f2937"> Global freelancer pools compete with AI on price.</tspan></text><circle cx="3702.0" cy="2777.8599999999997" r="6.048" fill="#111827" /><text x="3728.0" y="2800.7079999999996" font-size="33.6" font-weight="700" fill="#111827">Junior rung removed.<tspan font-weight="400" fill="#1f2937"> Entry roles automate first; pipelines dry up.</tspan></text><circle cx="3702.0" cy="2840.0199999999995" r="6.048" fill="#111827" /><text x="3728.0" y="2862.8679999999995" font-size="33.6" font-weight="700" fill="#111827">Discoverability collapse.<tspan font-weight="400" fill="#1f2937"> AI-flooded markets make it harder to be found.</tspan></text><circle cx="3702.0" cy="2902.1799999999994" r="6.048" fill="#111827" /><text x="3728.0" y="2925.0279999999993" font-size="33.6" font-weight="700" fill="#111827">Platform dependence.<tspan font-weight="400" fill="#1f2937"> Marketplaces and AI tool vendors capture an outsized share of value.</tspan></text><rect x="5380.0" y="2545.0" width="1690.0" height="485.0" rx="14" ry="14" fill="#ffffff" stroke="#d1d5db" stroke-width="2" /><g transform="translate(5402.0,2567.0) scale(4.014500000000001)" fill="#b91c1c"><path d="M2 9l4-4 3 3-4 4-3-3zm20 0l-4-4-3 3 4 4 3-3zm-9-2L9.5 10.5a1.5 1.5 0 1 0 2.12 2.12l1-1 4 4a1.5 1.5 0 1 0 2.12-2.12l-1-1 1-1a1.5 1.5 0 0 0 0-2.12L13.5 5.5 13 7zM4 15l4 4h2l-3-3-3-1zm16 0l-4 4h-2l3-3 3-1z"/></g><text x="5520.348" y="2621.684" font-size="52.080000000000005" font-weight="800" fill="#b91c1c" letter-spacing="1.5">PRO SALES</text><text x="5520.348" y="2658.3752000000004" font-size="26.208000000000002" font-style="italic" fill="#6b7280">SaaS  &middot;  Industrial  &middot;  MedTech</text><line x1="5402.0" y1="2671.348" x2="7048.0" y2="2671.348" stroke="#b91c1c" stroke-width="2.5" /><circle cx="5422.0" cy="2715.7" r="6.048" fill="#111827" /><text x="5448.0" y="2738.548" font-size="33.6" font-weight="700" fill="#111827">Product-led displacement.<tspan font-weight="400" fill="#1f2937"> Self-serve buying paths shrink the funnel.</tspan></text><circle cx="5422.0" cy="2777.8599999999997" r="6.048" fill="#111827" /><text x="5448.0" y="2800.7079999999996" font-size="33.6" font-weight="700" fill="#111827">AI procurement bots.<tspan font-weight="400" fill="#1f2937"> Buyers run RFPs and demos through agents.</tspan></text><circle cx="5422.0" cy="2840.0199999999995" r="6.048" fill="#111827" /><text x="5448.0" y="2862.8679999999995" font-size="33.6" font-weight="700" fill="#111827">Headcount cuts first.<tspan font-weight="400" fill="#1f2937"> Sales is a frequent early target in AI restructurings.</tspan></text><circle cx="5422.0" cy="2902.1799999999994" r="6.048" fill="#111827" /><text x="5448.0" y="2925.0279999999993" font-size="33.6" font-weight="700" fill="#111827">Comp plan churn.<tspan font-weight="400" fill="#1f2937"> AI productivity invites comp redesigns; reps capture less of each</tspan></text><text x="5448.0" y="2970.051999999999" font-size="33.6" fill="#1f2937">year&rsquo;s gain.</text><rect x="3660.0" y="3050.0" width="3410.0" height="110" rx="10" ry="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" stroke-opacity="0.6" /><rect x="3660.0" y="3050.0" width="10" height="110" fill="#b91c1c" /><text x="3690.0" y="3088.0" font-size="22" font-weight="800" fill="#b91c1c" letter-spacing="3">DATA POINT</text><text x="3690.0" y="3120.0" font-size="28" fill="#1f2937">Credible forecasts for transformative AI span 2027 to post-2050; Goldman Sachs estimates 25% of US work hours and ~300M jobs globally are exposed.</text><text x="7046.0" y="3138.0" font-size="22" font-style="italic" fill="#6b7280" text-anchor="end">&mdash; Ord (Mar 2026) &middot; Goldman Sachs (Mar 2026)</text><rect x="100" y="3240" width="7000" height="1180" rx="20" ry="20" fill="#eef2ff" stroke="#4338ca" stroke-width="5" /><rect x="100" y="3240" width="14" height="1180" fill="#4338ca" /><text x="150" y="3300" font-size="44" font-weight="800" fill="#3730a3" letter-spacing="3">A NOTE ON THOSE JUST ENTERING THE INDUSTRY TODAY</text><text x="150" y="3342" font-size="26" font-style="italic" fill="#4b5563">New entrants face a different SWOT than veterans &mdash; here is what shifts for each role.</text><line x1="150" y1="3370" x2="7070" y2="3370" stroke="#4338ca" stroke-width="2" stroke-opacity="0.35" /><rect x="140.0" y="3400" width="1710.0" height="990" rx="14" ry="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" /><g transform="translate(162.0,3422) scale(6.033697916666667)" fill="#166534"><path d="M12 2a1.2 1.2 0 0 0-1.2 1.2v.6L4.6 5.2a1 1 0 0 0 .4 1.96l5.8-1.16v13H6v2h12v-2h-4.8V6l5.8 1.16A1 1 0 0 0 19.4 5.2L13.2 3.8v-.6A1.2 1.2 0 0 0 12 2zM4 8l-3 7c0 1.66 1.34 3 3 3s3-1.34 3-3L4 8zm16 0l-3 7c0 1.66 1.34 3 3 3s3-1.34 3-3l-3-7z"/></g><text x="324.80875000000003" y="3504.18875" font-size="78.275" font-weight="800" fill="#166534" letter-spacing="1.5">PROFESSIONAL</text><text x="324.80875000000003" y="3559.33475" font-size="39.39" font-style="italic" fill="#6b7280">Lawyer  &middot;  Doctor  &middot;  Engineer</text><line x1="162.0" y1="3574.80875" x2="1828.0" y2="3574.80875" stroke="#166534" stroke-width="2" /><circle cx="182.0" cy="3641.46875" r="9.09" fill="#111827" /><text x="208.0" y="3675.80875" font-size="50.5" font-weight="700" fill="#111827">AI-native from day one.<tspan font-weight="400" fill="#1f2937"> No legacy workflows to unlearn</tspan></text><text x="208.0" y="3743.47875" font-size="50.5" fill="#1f2937">&mdash; fluency with agents and copilots is your default</text><text x="208.0" y="3811.1487500000003" font-size="50.5" fill="#1f2937">mode.</text><circle cx="182.0" cy="3870.2337500000003" r="9.09" fill="#111827" /><text x="208.0" y="3904.5737500000005" font-size="50.5" font-weight="700" fill="#111827">Apprentice rung is thinning.<tspan font-weight="400" fill="#1f2937"> Routine research, drafting, and</tspan></text><text x="208.0" y="3972.2437500000005" font-size="50.5" fill="#1f2937">review work that used to train juniors is exactly what AI</text><text x="208.0" y="4039.9137500000006" font-size="50.5" fill="#1f2937">does first.</text><circle cx="182.0" cy="4098.998750000001" r="9.09" fill="#111827" /><text x="208.0" y="4133.338750000001" font-size="50.5" font-weight="700" fill="#111827">Move:<tspan font-weight="400" fill="#1f2937"> Specialize narrow and build domain reps fast &mdash;</tspan></text><text x="208.0" y="4201.008750000001" font-size="50.5" fill="#1f2937">exam-passing knowledge is cheap; courtroom, bedside, and</text><text x="208.0" y="4268.678750000001" font-size="50.5" fill="#1f2937">field judgment is not.</text><rect x="1880.0" y="3400" width="1710.0" height="990" rx="14" ry="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" /><g transform="translate(1902.0,3422) scale(6.033697916666667)" fill="#1d4ed8"><path d="M11 2v2h-2v2h2v2h-1.5l-3 11h11l-3-11H13v-2h2v-2h-2V2h-2zm-3.5 17h9l.5 3h-10l.5-3z"/></g><text x="2064.80875" y="3504.18875" font-size="78.275" font-weight="800" fill="#1d4ed8" letter-spacing="1.5">EXECUTIVE</text><text x="2064.80875" y="3559.33475" font-size="39.39" font-style="italic" fill="#6b7280">CEO  &middot;  CFO  &middot;  CTO  &middot;  CHRO</text><line x1="1902.0" y1="3574.80875" x2="3568.0" y2="3574.80875" stroke="#1d4ed8" stroke-width="2" /><circle cx="1922.0" cy="3641.46875" r="9.09" fill="#111827" /><text x="1948.0" y="3675.80875" font-size="50.5" font-weight="700" fill="#111827">Cross-functional fluency.<tspan font-weight="400" fill="#1f2937"> You arrive expecting to lead</tspan></text><text x="1948.0" y="3743.47875" font-size="50.5" fill="#1f2937">AI-augmented teams; legacy execs are still translating the</text><text x="1948.0" y="3811.1487500000003" font-size="50.5" fill="#1f2937">playbook.</text><circle cx="1922.0" cy="3870.2337500000003" r="9.09" fill="#111827" /><text x="1948.0" y="3904.5737500000005" font-size="50.5" font-weight="700" fill="#111827">Management ladder is shorter.<tspan font-weight="400" fill="#1f2937"> If middle management</tspan></text><text x="1948.0" y="3972.2437500000005" font-size="50.5" fill="#1f2937">compresses, the path from analyst to operator runs through</text><text x="1948.0" y="4039.9137500000006" font-size="50.5" fill="#1f2937">fewer rungs and tighter scrutiny.</text><circle cx="1922.0" cy="4098.998750000001" r="9.09" fill="#111827" /><text x="1948.0" y="4133.338750000001" font-size="50.5" font-weight="700" fill="#111827">Move:<tspan font-weight="400" fill="#1f2937"> Get P&amp;L exposure early &mdash; own a number, not a</tspan></text><text x="1948.0" y="4201.008750000001" font-size="50.5" fill="#1f2937">function. Track records, not titles, will determine who</text><text x="1948.0" y="4268.678750000001" font-size="50.5" fill="#1f2937">reaches the C-suite.</text><rect x="3620.0" y="3400" width="1710.0" height="990" rx="14" ry="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" /><g transform="translate(3642.0,3422) scale(6.033697916666667)" fill="#b45309"><path d="M9 3a1 1 0 0 0-1 1v2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4V4a1 1 0 0 0-1-1H9zm1 2h4v1h-4V5zM4 11h4v2H4v-2zm12 0h4v2h-4v-2zm-6 0h4v4h-4v-4z"/></g><text x="3804.80875" y="3504.18875" font-size="78.275" font-weight="800" fill="#b45309" letter-spacing="1.5">SERVICE</text><text x="3804.80875" y="3559.33475" font-size="39.39" font-style="italic" fill="#6b7280">Educator  &middot;  Programmer  &middot;  Consultant</text><line x1="3642.0" y1="3574.80875" x2="5308.0" y2="3574.80875" stroke="#b45309" stroke-width="2" /><circle cx="3662.0" cy="3641.46875" r="9.09" fill="#111827" /><text x="3688.0" y="3675.80875" font-size="50.5" font-weight="700" fill="#111827">Solo leverage from day one.<tspan font-weight="400" fill="#1f2937"> A single practitioner with AI can</tspan></text><text x="3688.0" y="3743.47875" font-size="50.5" fill="#1f2937">launch what used to require a small team &mdash; productize</text><text x="3688.0" y="3811.1487500000003" font-size="50.5" fill="#1f2937">early.</text><circle cx="3662.0" cy="3870.2337500000003" r="9.09" fill="#111827" /><text x="3688.0" y="3904.5737500000005" font-size="50.5" font-weight="700" fill="#111827">Commodity floor is rising.<tspan font-weight="400" fill="#1f2937"> Tutoring, boilerplate code, and</tspan></text><text x="3688.0" y="3972.2437500000005" font-size="50.5" fill="#1f2937">template decks are the AI baseline &mdash; you compete on</text><text x="3688.0" y="4039.9137500000006" font-size="50.5" fill="#1f2937">taste, judgment, and reach.</text><circle cx="3662.0" cy="4098.998750000001" r="9.09" fill="#111827" /><text x="3688.0" y="4133.338750000001" font-size="50.5" font-weight="700" fill="#111827">Move:<tspan font-weight="400" fill="#1f2937"> Build an audience and a body of work in public.</tspan></text><text x="3688.0" y="4201.008750000001" font-size="50.5" fill="#1f2937">Reputation, not credentials, is the durable moat in service</text><text x="3688.0" y="4268.678750000001" font-size="50.5" fill="#1f2937">work.</text><rect x="5360.0" y="3400" width="1710.0" height="990" rx="14" ry="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" /><g transform="translate(5382.0,3422) scale(6.033697916666667)" fill="#b91c1c"><path d="M2 9l4-4 3 3-4 4-3-3zm20 0l-4-4-3 3 4 4 3-3zm-9-2L9.5 10.5a1.5 1.5 0 1 0 2.12 2.12l1-1 4 4a1.5 1.5 0 1 0 2.12-2.12l-1-1 1-1a1.5 1.5 0 0 0 0-2.12L13.5 5.5 13 7zM4 15l4 4h2l-3-3-3-1zm16 0l-4 4h-2l3-3 3-1z"/></g><text x="5544.80875" y="3504.18875" font-size="78.275" font-weight="800" fill="#b91c1c" letter-spacing="1.5">PRO SALES</text><text x="5544.80875" y="3559.33475" font-size="39.39" font-style="italic" fill="#6b7280">SaaS  &middot;  Industrial  &middot;  MedTech</text><line x1="5382.0" y1="3574.80875" x2="7048.0" y2="3574.80875" stroke="#b91c1c" stroke-width="2" /><circle cx="5402.0" cy="3641.46875" r="9.09" fill="#111827" /><text x="5428.0" y="3675.80875" font-size="50.5" font-weight="700" fill="#111827">Tooling fluency advantage.<tspan font-weight="400" fill="#1f2937"> AI-native reps work pipelines that</tspan></text><text x="5428.0" y="3743.47875" font-size="50.5" fill="#1f2937">legacy reps still run by hand &mdash; early productivity</text><text x="5428.0" y="3811.1487500000003" font-size="50.5" fill="#1f2937">gains compound fast.</text><circle cx="5402.0" cy="3870.2337500000003" r="9.09" fill="#111827" /><text x="5428.0" y="3904.5737500000005" font-size="50.5" font-weight="700" fill="#111827">Funnel arrives shorter.<tspan font-weight="400" fill="#1f2937"> Buyers self-serve through more of the</tspan></text><text x="5428.0" y="3972.2437500000005" font-size="50.5" fill="#1f2937">journey; you meet them later and warmer, but with less time</text><text x="5428.0" y="4039.9137500000006" font-size="50.5" fill="#1f2937">to differentiate.</text><circle cx="5402.0" cy="4098.998750000001" r="9.09" fill="#111827" /><text x="5428.0" y="4133.338750000001" font-size="50.5" font-weight="700" fill="#111827">Move:<tspan font-weight="400" fill="#1f2937"> Go vertical and go technical &mdash; pick a regulated</tspan></text><text x="5428.0" y="4201.008750000001" font-size="50.5" fill="#1f2937">industry and learn the customer&rsquo;s business cold.</text><text x="5428.0" y="4268.678750000001" font-size="50.5" fill="#1f2937">Generic reps lose first.</text><text x="3600.0" y="4470" font-size="22" fill="#9ca3af" text-anchor="middle">SWOT 4&#215;4 Panel  &#183;  Companion to "AI &amp; The Mid-Career Professional"  &#183;  Sources: Goldman Sachs (Mar 2026)  &#183;  METR (Mar 2026)  &#183;  Toby Ord (Mar 2026)  &#183;  Vector graphic, scales freely</text></svg></div>
